<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EBDD">
<title>小狗的礼物盒</title>
<style>
  :root { --ink: #4a3426; --soft: #8a6a55; --card: #fffaf3; --pink: #f19bb8; --line: #ead8c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #F6EBDD; color: var(--ink); font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 36px); }
  header { text-align: center; margin-bottom: 22px; }
  .dog { width: 120px; height: 150px; margin: 0 auto 4px; background: url(photo/assets/sit.webp) no-repeat; background-size: 600% 100%; background-position: 40% 0; }
  h1 { margin: 0; font: 900 30px "Songti SC", Georgia, serif; letter-spacing: .06em; }
  header p { margin: 6px 0 0; color: var(--soft); font-size: 14px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  a.card { display: flex; flex-direction: column; gap: 4px; padding: 16px 14px 14px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; color: inherit; text-decoration: none; box-shadow: 0 2px 10px #0000000a; transition: transform .15s; }
  a.card:active { transform: scale(.97); }
  a.card .em { font-size: 30px; line-height: 1.1; }
  a.card b { font-size: 16px; }
  a.card span { color: var(--soft); font-size: 12.5px; line-height: 1.5; }
  a.card.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 12px; }
  a.card.wide .em { font-size: 34px; }
  footer { margin-top: 22px; text-align: center; color: #b9a08c; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="dog"></div>
    <h1>小狗的礼物盒</h1>
    <p>给小猫的,一个一个拆。</p>
  </header>
  <div class="grid">
    <a class="card wide" href="love-calendar/"><div class="em">📅</div><div><b>爱的日历</b><br><span>每天的两件小事,和挂在上面的礼物</span></div></a>
    <a class="card" href="hunt/"><div class="em">🧩</div><b>寻宝解谜</b><span>四张谜题卡,拼出藏起来的那句话</span></a>
    <a class="card" href="hunt/train.html"><div class="em">🐶</div><b>训小狗模拟器</b><span>通关奖励</span></a>
    <a class="card" href="hunt/lock.html"><div class="em">🔒</div><b>密码锁</b><span>密码在我的心里</span></a>
    <a class="card" href="campus/"><div class="em">🏫</div><b>清华园 2.5D</b><span>骑车带小狗逛校园,还有一场寻宝</span></a>
    <a class="card" href="campus/film.mp4"><div class="em">🎬</div><b>奖励短片</b><span>清华园寻宝的最后一份奖励</span></a>
    <a class="card" href="poem/"><div class="em">📝</div><b>拼贴诗</b><span>两个人一起拼的诗</span></a>
    <a class="card wide" href="photo/"><div class="em">📷</div><div><b>小狗跳进照片</b><br><span>打开相机或选一张照片,小狗就跑进来</span></div></a>
  </div>
  <footer>—— 你的小狗</footer>
</main>
</body>
</html>
